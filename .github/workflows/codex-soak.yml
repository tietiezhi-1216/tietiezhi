name: Codex Runtime Soak

on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Per-platform soak duration in seconds
        required: false
        default: '900'

jobs:
  soak:
    name: Soak (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    env:
      TIETIEZHI_SOAK_SECONDS: ${{ inputs.duration_seconds || '900' }}
      TIETIEZHI_SOAK_TOOL_CALLS: '256'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/agent-stability
            crates/agent-exec
            crates/agent-mcp
            crates/agent-model
            crates/agent-state
            crates/agent-tools
      - name: Run ignored long-runtime soak
        run: cargo test --manifest-path ../crates/agent-stability/Cargo.toml long_runtime_soak_has_no_process_session_leak -- --ignored --test-threads=1
