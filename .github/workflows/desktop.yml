name: CI (Desktop · Tauri)

# 桌面客户端（desktop/）的持续集成：Windows + macOS 双平台
# typecheck + Rust 测试 + tauri build。
# macOS 签名 + 公证：配齐 APPLE_* secrets 后 tauri build 自动签名 → 公证 → 装订；未配置则回退 ad-hoc。
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'crates/**'
      - 'shared/codex/**'
      - 'docs/CODEX-*.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'crates/**'
      - 'shared/codex/**'
      - 'docs/CODEX-*.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            bundles: app,dmg
          - platform: windows
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    # A hung test must fail here, not idle until the 6h platform ceiling.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本取自 desktop/package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            crates/agent-protocol
            crates/agent-events
            crates/agent-state
            crates/agent-core
            crates/agent-collab
            crates/agent-review
            crates/agent-memory
            crates/agent-git
            crates/agent-config
            crates/agent-skills
            crates/agent-hooks
            crates/agent-plugins
            crates/agent-apps
            crates/agent-context
            crates/agent-tools
            crates/agent-model
            crates/agent-network
            crates/agent-account
            crates/agent-approval
            crates/agent-patch
            crates/agent-exec
            crates/agent-sandbox
            crates/agent-absolute-path
            crates/agent-shell-command
            crates/agent-execpolicy
            crates/agent-mcp
            crates/agent-remote
            crates/agent-realtime
            crates/agent-observability
            crates/agent-stability

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Check Codex parity ledger
        run: pnpm check:codex-parity

      - name: Check Codex protocol snapshots
        run: pnpm check:codex-schema

      - name: Check Codex model catalog
        run: pnpm check:codex-models

      - name: Typecheck Codex protocol
        run: pnpm test:codex-protocol-ts

      - name: Check chat event migration
        run: pnpm test:chat-event-migration

      - name: Check conversation persistence migration
        run: pnpm test:conversation-migration

      - name: Check Local and Worktree environment UI
        run: pnpm test:workspace-environment-ui

      - name: Check Codex workspace tools side panel
        run: pnpm test:workspace-tools-panel

      - name: Check Workspace full chat model list
        run: pnpm test:workspace-model-list

      - name: Check integrated Thread terminal UI
        run: pnpm test:integrated-terminal-ui

      - name: Check Codex typed timeline UI
        run: pnpm test:codex-timeline-ui

      - name: Check workspace Git Diff UI
        run: pnpm test:workspace-git-ui

      - name: Check Codex Apps UI
        run: pnpm test:codex-apps-ui

      - name: Check Codex Automations UI
        run: pnpm test:codex-automations-ui

      - name: Check Codex Remote Control and Realtime UI
        run: pnpm test:codex-remote-realtime-ui

      - name: Check Codex Runtime diagnostics UI
        run: pnpm test:codex-runtime-diagnostics-ui

      - name: Check Workspace Codex Runtime switch
        run: pnpm test:codex-runtime-switch

      - name: Check Codex GA release invariants
        run: pnpm test:codex-release

      - name: Check Codex approval UI
        run: pnpm test:codex-approval-ui

      - name: Codex protocol Rust tests
        run: cargo test --manifest-path ../crates/agent-protocol/Cargo.toml

      - name: Codex event Rust tests
        run: cargo test --manifest-path ../crates/agent-events/Cargo.toml

      - name: Codex state and crash recovery tests
        run: cargo test --manifest-path ../crates/agent-state/Cargo.toml

      - name: Codex thread runtime tests
        run: cargo test --manifest-path ../crates/agent-core/Cargo.toml

      - name: Codex MultiAgentV2 collaboration tests
        run: cargo test --manifest-path ../crates/agent-collab/Cargo.toml

      - name: Codex Guardian and Review tests
        run: cargo test --manifest-path ../crates/agent-review/Cargo.toml

      - name: Codex Chronicle memory tests
        run: cargo test --manifest-path ../crates/agent-memory/Cargo.toml

      - name: Codex Local, Worktree, snapshot, and Handoff tests
        run: cargo test --manifest-path ../crates/agent-git/Cargo.toml

      - name: Codex context and compaction tests
        run: cargo test --manifest-path ../crates/agent-context/Cargo.toml

      - name: Codex layered instructions and World State tests
        run: cargo test --manifest-path ../crates/agent-config/Cargo.toml

      - name: Codex Skills discovery and lazy loading tests
        run: cargo test --manifest-path ../crates/agent-skills/Cargo.toml

      - name: Codex Hooks discovery, trust, and command lifecycle tests
        run: cargo test --manifest-path ../crates/agent-hooks/Cargo.toml

      - name: Codex Plugins, Marketplace, and activation tests
        run: cargo test --manifest-path ../crates/agent-plugins/Cargo.toml

      - name: Codex Apps and connector catalog tests
        run: cargo test --manifest-path ../crates/agent-apps/Cargo.toml

      - name: Codex tool kernel and built-in tool tests
        run: cargo test --manifest-path ../crates/agent-tools/Cargo.toml

      - name: Codex approval broker tests
        run: cargo test --manifest-path ../crates/agent-approval/Cargo.toml

      - name: Codex atomic apply patch tests
        run: cargo test --manifest-path ../crates/agent-patch/Cargo.toml

      - name: Codex PTY and unified exec tests
        run: cargo test --manifest-path ../crates/agent-exec/Cargo.toml

      - name: Windows elevated identity, Firewall, and WFP escape tests
        if: matrix.platform == 'windows'
        run: cargo test --manifest-path ../crates/agent-exec/Cargo.toml --test windows_sandbox -- --test-threads=1

      - name: Codex platform sandbox tests
        run: cargo test --manifest-path ../crates/agent-sandbox/Cargo.toml

      - name: Codex attributed network proxy tests
        run: cargo test --manifest-path ../crates/agent-network/Cargo.toml

      - name: Codex absolute path invariant tests
        run: cargo test --manifest-path ../crates/agent-absolute-path/Cargo.toml

      - name: Codex shell parsing and safety tests
        run: cargo test --manifest-path ../crates/agent-shell-command/Cargo.toml

      - name: Codex ExecPolicy tests
        run: cargo test --manifest-path ../crates/agent-execpolicy/Cargo.toml

      - name: Codex MCP protocol and stdio interoperability tests
        run: cargo test --manifest-path ../crates/agent-mcp/Cargo.toml

      - name: Codex Responses model tests
        run: cargo test --manifest-path ../crates/agent-model/Cargo.toml

      - name: Codex account and Gateway mapping tests
        run: cargo test --manifest-path ../crates/agent-account/Cargo.toml

      - name: Codex Remote Control authorization tests
        run: cargo test --manifest-path ../crates/agent-remote/Cargo.toml

      - name: Codex Realtime transport and reconnect tests
        run: cargo test --manifest-path ../crates/agent-realtime/Cargo.toml

      - name: Codex observability, Doctor, feedback, and attestation tests
        run: cargo test --manifest-path ../crates/agent-observability/Cargo.toml

      - name: Codex fault injection and runtime stability tests
        run: cargo test --manifest-path ../crates/agent-stability/Cargo.toml -- --test-threads=1

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tauri build
        env:
          # macOS 签名 + 公证：配齐下列 secrets 后 tauri build 自动签名 → 公证 → 装订；
          # 未配置（值为空）时回退 ad-hoc（当前行为）。Windows 构建忽略这些变量。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 应用内更新（tauri updater）产物签名：私钥 + 密码（minisign）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      # Tauri 只公证并装订了 .app，未公证外层 dmg（下载 dmg 仍会被 Gatekeeper 拦）。
      # 这里对 dmg 单独公证 + 装订，实现「下载 dmg 即开、零警告」。未配公证凭据则跳过。
      - name: Notarize & staple DMG (macOS)
        if: matrix.platform == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then echo "未配置公证凭据，跳过 dmg 公证"; exit 0; fi
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -1)
          [ -z "$DMG" ] && { echo "未找到 dmg，跳过"; exit 0; }
          echo "公证 dmg: $DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # updater 产物：macOS 为 *.app.tar.gz(+.sig)，Windows 直接复用 nsis exe(+.sig)。
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tietiezhi-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
