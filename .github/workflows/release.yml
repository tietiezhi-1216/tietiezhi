name: Release (Electron Desktop)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            command: dist:mac
          - platform: windows
            os: windows-latest
            command: dist:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Test
        run: pnpm test
      - name: Validate macOS signing configuration
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || {
              echo "缺少 macOS 签名或公证配置：$name"
              exit 1
            }
          done
      - name: Build packages
        run: pnpm ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
      - name: Validate macOS package
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find release/mac-universal -maxdepth 1 -name '*.app' -type d | head -1)
          DMG=$(find release -maxdepth 1 -name '*.dmg' -type f | head -1)
          [ -n "$APP" ] && [ -n "$DMG" ]
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/$EXECUTABLE")
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          hdiutil verify "$DMG"
          pnpm smoke:package "$APP/Contents/MacOS/$EXECUTABLE"
      - name: Validate Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $executable = Get-ChildItem release/win-unpacked -Filter *.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) {
            throw "未找到 Windows 应用可执行文件"
          }
          pnpm smoke:package $executable
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
