name: Release (Electron Desktop)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            command: dist:mac
          - platform: windows
            os: windows-latest
            command: dist:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Test
        run: pnpm test
      - name: Validate macOS signing configuration
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || {
              echo "缺少 macOS 签名或公证配置：$name"
              exit 1
            }
          done
      - name: Build packages
        run: pnpm ${{ matrix.command }}
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
      - name: Validate macOS package
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          APPS=$(find release -maxdepth 2 -name '*.app' -type d)
          [ "$(printf '%s\n' "$APPS" | sed '/^$/d' | wc -l | tr -d ' ')" = "2" ]
          FOUND_ARM64=0
          FOUND_X64=0
          while IFS= read -r APP; do
            [ -n "$APP" ] || continue
            EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
            ARCHS=$(lipo -archs "$APP/Contents/MacOS/$EXECUTABLE")
            [ "$ARCHS" = "arm64" ] && FOUND_ARM64=1
            [ "$ARCHS" = "x86_64" ] && FOUND_X64=1
            codesign --verify --deep --strict --verbose=2 "$APP"
            xcrun stapler validate "$APP"
            if { [ "$ARCHS" = "arm64" ] && [ "$(uname -m)" = "arm64" ]; } ||
               { [ "$ARCHS" = "x86_64" ] && [ "$(uname -m)" = "x86_64" ]; }; then
              pnpm smoke:package "$APP/Contents/MacOS/$EXECUTABLE"
            fi
          done <<< "$APPS"
          [ "$FOUND_ARM64" = "1" ] && [ "$FOUND_X64" = "1" ]
          for DMG in release/*.dmg; do
            hdiutil verify "$DMG"
          done
          test -f release/latest-mac.yml
          grep -q 'arm64.zip' release/latest-mac.yml
          grep -q 'x64.zip' release/latest-mac.yml
      - name: Validate Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $executable = Get-ChildItem release/win-unpacked -Filter *.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) {
            throw "未找到 Windows 应用可执行文件"
          }
          pnpm smoke:package $executable
          if (-not (Test-Path release/latest.yml)) {
            throw "未生成 Windows 更新元数据"
          }
          if (-not (Get-ChildItem release -Filter *.blockmap)) {
            throw "未生成 Windows 差分更新数据"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
