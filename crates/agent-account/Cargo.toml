[package]
name = "tietiezhi-agent-account"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tietiezhi-agent-protocol = { path = "../agent-protocol" }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
