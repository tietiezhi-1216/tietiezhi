[package]
name = "tietiezhi-agent-collab"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tietiezhi-agent-tools = { path = "../agent-tools" }
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
