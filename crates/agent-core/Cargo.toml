[package]
name = "tietiezhi-agent-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tietiezhi-agent-context = { path = "../agent-context" }
tietiezhi-agent-model = { path = "../agent-model" }
tietiezhi-agent-protocol = { path = "../agent-protocol" }
tietiezhi-agent-state = { path = "../agent-state" }
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
