[package]
name = "tietiezhi-agent-exec"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[[bin]]
name = "tietiezhi-agent-exec-sandbox-runner"
path = "src/bin/windows_sandbox_runner.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tietiezhi-agent-sandbox = { path = "../agent-sandbox" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
filedescriptor = "0.8.3"
lazy_static = "1"
log = "0.4"
shared_library = "0.1.9"
winapi = { version = "0.3.9", features = ["handleapi", "minwinbase", "processthreadsapi", "synchapi", "winbase", "wincon", "winerror", "winnt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
