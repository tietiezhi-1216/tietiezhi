[package]
name = "tietiezhi-agent-execpolicy"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
anyhow = "1"
tietiezhi-agent-absolute-path = { path = "../agent-absolute-path" }
tietiezhi-agent-shell-command = { path = "../agent-shell-command" }
multimap = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
starlark = { version = "0.14.2", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt"] }

[dev-dependencies]
pretty_assertions = "1"
