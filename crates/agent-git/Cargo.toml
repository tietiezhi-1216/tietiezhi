[package]
name = "tietiezhi-agent-git"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
dunce = "1"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
