[package]
name = "tietiezhi-agent-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
http = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tietiezhi-agent-tools = { path = "../agent-tools" }
rmcp = { version = "2.2.0", default-features = false, features = [
    "auth",
    "base64",
    "client",
    "elicitation",
    "macros",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tietiezhi-agent-protocol = { path = "../agent-protocol" }
