[package]
name = "tietiezhi-agent-plugins"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
tietiezhi-agent-protocol = { path = "../agent-protocol" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
