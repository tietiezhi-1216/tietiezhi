[package]
name = "tietiezhi-agent-shell-command"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
base64 = "0.21.7"
tietiezhi-agent-absolute-path = { path = "../agent-absolute-path" }
libc = "0.2"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
url = "2"
which = "6.0.3"

[dev-dependencies]
anyhow = "1"
pretty_assertions = "1"
