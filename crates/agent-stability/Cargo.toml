[package]
name = "tietiezhi-agent-stability"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[[bin]]
name = "mcp_hang_fixture"
path = "src/bin/mcp_hang_fixture.rs"

[dependencies]
rmcp = { version = "2.2.0", default-features = false, features = [
    "macros",
    "server",
    "transport-io",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
tietiezhi-agent-exec = { path = "../agent-exec" }
tietiezhi-agent-mcp = { path = "../agent-mcp" }
tietiezhi-agent-model = { path = "../agent-model" }
tietiezhi-agent-state = { path = "../agent-state" }
tietiezhi-agent-tools = { path = "../agent-tools" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
