[package]
name = "tietiezhi-agent-state"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
