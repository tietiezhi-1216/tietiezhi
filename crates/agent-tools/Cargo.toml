[package]
name = "tietiezhi-agent-tools"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
base64 = "0.22"
bm25 = "2.3.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tietiezhi-agent-approval = { path = "../agent-approval" }
tietiezhi-agent-patch = { path = "../agent-patch" }
tietiezhi-agent-protocol = { path = "../agent-protocol" }
tokio = { version = "1", features = ["fs", "sync", "rt", "macros", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
