[package]
name = "tietiezhi-agent-tools"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tietiezhi-agent-protocol = { path = "../agent-protocol" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7"
